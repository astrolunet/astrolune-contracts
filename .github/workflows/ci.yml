name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trocto
        run: |
          curl -sL https://github.com/astrolunet/trocto/releases/latest/download/trocto-linux -o /usr/local/bin/trocto
          chmod +x /usr/local/bin/trocto
        continue-on-error: true

      - name: Build Trocto from source
        if: failure()
        run: |
          git clone https://github.com/astrolunet/trocto.git /tmp/trocto
          cd /tmp/trocto
          cmake --preset dev
          cmake --build --preset dev
          sudo cp build/dev/trocto /usr/local/bin/trocto

      - name: Compile contracts
        run: |
          for f in $(find . -name "*.tc"); do
            echo "Compiling $f..."
            trocto "$f" -o "${f%.tc}.bin"
          done

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: "**/*.bin"

  release:
    needs: compile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: contracts/**/*
          generate_release_notes: true
