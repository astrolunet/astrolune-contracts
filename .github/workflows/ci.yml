name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Trocto from source
        run: |
          git clone --depth 1 https://github.com/astrolunet/trocto.git /tmp/trocto
          cd /tmp/trocto
          cmake --preset release
          cmake --build --preset release
          sudo cp build/release/trocto /usr/local/bin/trocto
          trocto --version || echo "trocto built"

      - name: Compile contracts
        run: |
          for f in $(find . -name "*.tc"); do
            echo "Compiling $f..."
            trocto "$f" -o "${f%.tc}.bin"
          done

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: "**/*.bin"

  release:
    needs: compile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: contracts/**/*
          generate_release_notes: true
