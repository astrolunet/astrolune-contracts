name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Trocto from source
        run: |
          git clone --depth 1 https://github.com/astrolunet/trocto.git /tmp/trocto
          cd /tmp/trocto
          cmake --preset release
          cmake --build --preset release
          sudo cp build/release/trocto /usr/local/bin/trocto
          trocto --help

      - name: Compile contracts
        run: |
          set -euo pipefail
          PASS=0
          mapfile -d '' files < <(find . -name '*.tc' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .tc contracts found" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Compiling $f..."
            trocto "$f" -o "${f%.tc}.bin"
            PASS=$((PASS + 1))
          done
          echo "Compiled: $PASS"

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: "**/*.bin"

  release:
    needs: compile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: contracts/**/*
          generate_release_notes: true
